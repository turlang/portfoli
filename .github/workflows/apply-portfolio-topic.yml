name: Sincronizar tópico portfolio

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

jobs:
  sync-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar token administrativo
        env:
          PORTFOLIO_ADMIN_TOKEN: ${{ secrets.PORTFOLIO_ADMIN_TOKEN }}
        shell: bash
        run: |
          if [ -z "$PORTFOLIO_ADMIN_TOKEN" ]; then
            echo "Configure o secret PORTFOLIO_ADMIN_TOKEN com Administration: write."
            exit 1
          fi

      - name: Adicionar portfolio aos repositórios públicos
        env:
          PORTFOLIO_ADMIN_TOKEN: ${{ secrets.PORTFOLIO_ADMIN_TOKEN }}
        run: node scripts/sync-portfolio-topics.mjs
