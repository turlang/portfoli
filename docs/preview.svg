<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Preview real do Portfólio Profissional</title><desc id="desc">Captura fiel do portfólio com hero, projetos e tecnologias.</desc><rect width="1600" height="900" fill="#050913"/><defs><linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050913"/><stop offset=".5" stop-color="#0d1b2c"/><stop offset="1" stop-color="#060712"/></linearGradient><linearGradient id="pa" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39d0ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><g font-family="Arial,Helvetica,sans-serif"><rect width="1600" height="900" fill="url(#pbg)"/><rect width="1600" height="78" fill="#050913" fill-opacity=".95"/><text x="78" y="50" fill="#fff" font-size="22" font-weight="800">Evandro <tspan fill="#4fd1ff">Ricardo</tspan></text><g fill="#c6d0dc" font-size="15"><text x="965" y="47">Início</text><text x="1035" y="47">Sobre</text><text x="1110" y="47">Projetos</text><text x="1200" y="47">Habilidades</text><text x="1300" y="47">Contato</text></g><text x="90" y="180" fill="#4fd1ff" font-size="17" font-weight="700">DESENVOLVEDOR FULL STACK</text><text x="90" y="265" fill="#fff" font-size="70" font-weight="850">Transformo ideias em</text><text x="90" y="342" fill="url(#pa)" font-size="70" font-weight="850">produtos digitais.</text><text x="94" y="400" fill="#b7c5d5" font-size="22">SaaS, dashboards, automações e soluções com inteligência artificial</text><text x="94" y="435" fill="#b7c5d5" font-size="22">construídas para resolver problemas reais.</text><rect x="90" y="485" width="195" height="56" rx="28" fill="url(#pa)"/><text x="128" y="520" fill="#07101b" font-size="16" font-weight="800">VER PROJETOS</text><rect x="305" y="485" width="180" height="56" rx="28" fill="none" stroke="#4fd1ff"/><text x="348" y="520" fill="#fff" font-size="16" font-weight="700">SOBRE MIM</text><g transform="tra